# ==============================================================================
# ServerChangelogs Localization: ru_RU (Russian)
# Defines player- and console-facing MiniMessage translation templates.
# ==============================================================================

# Параметр <click:open_url:...> ниже делает так, что нажатие на название плагина в любом месте
# (включая префикс) откроет страницу на Modrinth! Если это не нужно, можно раскомментировать версию
# строкой ниже (убрать #) и закомментировать текущую (поставить # перед ней).
plugin_name: "<click:open_url:https://modrinth.com/project/server-changelogs><gradient:#a366ff:#9999ff><b><plugin:name>"
#plugin_name: "<gradient:#a366ff:#9999ff><b><plugin:name>"
prefix: "<translate:plugin_name><reset><dark_gray> » <reset>" # Префикс плагина, можно использовать через <prefix>
meta.unknown: "<red>Неизвестно"
console: # Переводы для большинства сообщений плагина в консоли сервера
  startup: "<translate:plugin_name> <gray>v<plugin:version></gray> запущен на <platform:name> <gray><platform:version>"
  startup_storage: "Инициализация хранилища списка изменений <green>\"<arg:0>\"</green>..."
  join.frozen: "Игрок <aqua><arg:0></aqua> заморожен согласно конфигурации во время просмотра новых списков изменений"
  reload: "<aqua>Перезагрузка плагина..."
  shutdown: "<red>Выключение, до встречи!"
command: # Переводы команд плагина
  onlyplayer: "<prefix><red>Эту команду может выполнять только игрок"
  root: |-
    <dark_gray><strikethrough>              <reset> <translate:plugin_name> <gray>v<plugin:version></gray> <dark_gray><strikethrough>              
    <reset><plugin:description>
    Запущен на <platform:name> <gray><platform:version></gray>
    Создатель: <green><plugin:authors></green>
  reload:
    success: "<prefix><green>Перезагрузка выполнена успешно, заняло <aqua><arg:0>мс</aqua>!"
    error:
      io: "<prefix><red>Произошла непредвиденная ошибка ввода-вывода при перезагрузке, подробности в консоли!"
      details: "<red>Подробности непредвиденной ошибки перезагрузки:"
      invalid: "<prefix><red>Некорректная конфигурация: <yellow><arg:0>"
      dialog_reject:
        saved_sessions: >-
          <prefix><yellow>Остались сохранённые <aqua>черновики</aqua> редактора.
          Обратите внимание: перезагрузка <red>удалит</red> эти черновики! Чтобы всё равно перезагрузить плагин,
          <click:suggest_command:'/changelogs reload --force'><red><u>нажмите сюда</u></red></click>.
icon: # Общие иконки; смена значения здесь меняет иконку везде
  confirm: "<sprite:gui:icon/checkmark>" # Все иконки — это текстуры из ванильного ресурс-пака (атлас gui)
  deny: "<sprite:gui:spectator/close>"
  changelog: "<sprite:gui:icon/news>"
  letter: "<sprite:gui:icon/draft_report>"
  attention: "<sprite:gui:icon/unseen_notification>"
  warning: "<sprite:gui:dialog/warning_button>"
  search: "<sprite:gui:icon/search>"
  speech_bubble: "<sprite:gui:toast/social_interactions>"
  info: "<sprite:gui:icon/info>"
  back: "<sprite:gui:widget/page_backward>"
dialog: # Переводы диалоговых интерфейсов (UI) плагина
  error: "<red>Произошла непредвиденная ошибка при обработке действия в диалоге:"
  popup:
    confirm: "<translate:icon.confirm> <green><b>Подтвердить"
    confirm_danger: "<translate:icon.warning> <red><b>Подтвердить"
    cancel: "<translate:icon.deny> <dark_red><b>Отмена"
    close: "<translate:icon.confirm> <green>Ок"
  editor: # Интерфейс создания и редактирования списка изменений
    create: # Переводы для режима создания
      title: "<gradient:#a366ff:#9999ff><b>Создать список изменений"
      subtitle: "Это действие <green>создаст</green> новую запись списка изменений <aqua>#<arg:0>"
      commit_button: "<translate:icon.changelog> <aqua><b>Опубликовать список изменений"
      success: "<translate:icon.confirm> <green>Новый список изменений успешно опубликован!"
    edit: # Переводы для режима редактирования
      title: "<gradient:#a366ff:#9999ff><b>Редактировать список изменений"
      subtitle: "Это действие <light_purple>обновит</light_purple> содержимое списка изменений <aqua>#<arg:0>"
      commit_button: "<translate:icon.letter> <aqua><b>Применить изменения"
      success: "<translate:icon.confirm> <green>Изменения успешно применены!"
    hint: |-
      Добавляйте <green>строки</green> в новый список изменений ниже. Поддерживается разметка <rainbow>MiniMessage</rainbow>!
      Дефисы <gray>(<b>-</b>)</gray> добавляются автоматически. Используйте <red>одну строку</red> для описания <red>одного</red> изменения.
      Ниже доступен <green>предпросмотр</green> вашего списка изменений:
    empty_preview: "<translate:icon.search> <u><gray>Добавьте строку в поле ниже, чтобы увидеть предпросмотр."
    restored_session: "<translate:icon.info> <green>Сессия восстановлена с момента вашего прошлого использования редактора."
    input:
      contents: "Текст строки"
      author: "Автор <gray>(необязательно)</gray>"
    button:
      add_line: "<translate:icon.speech_bubble> <green><b>Добавить строку"
      edit_line: "<translate:icon.confirm> <light_purple><b>Изменить строку"
      close: "<translate:icon.deny> <red><b>Закрыть"
    line_action:
      format: "<dark_gray>[<arg:0>]"
      edit: "<light_purple><hover:show_text:'<light_purple>✎ Редактировать строку'>✎"
      remove: "<red><hover:show_text:'<red>❌ Удалить строку'>❌"
    confirm_close:
      button:
        save_session: "<translate:icon.letter> <green><b>Сохранить и закрыть"
        discard_session: "<translate:icon.warning> <red><b>Сбросить и закрыть"
        cancel: "<translate:icon.back> <gold><b>Продолжить редактирование"
      content: |-
        Вы уверены, что хотите <red>сбросить</red> все внесенные изменения?
        
        Вы можете <green>сохранить работу</green> до <aqua>следующего</aqua> открытия редактора.
        Если вы не хотите <green>сохранять сессию</green> и планируете <yellow>начать заново</yellow> в следующий раз, можно её <red>сбросить</red>.
        Также можно <gold>вернуться назад</gold> к редактированию текущего списка изменений.
        
        <translate:icon.attention> Учтите, что <green>сохранённые</green> сессии <red><b>НЕ СОХРАНЯЮТСЯ</b></red> при <red>перезагрузках</red> сервера!
    error:
      create:
        internal_error: |-
          <translate:icon.deny> <red>Произошла внутренняя ошибка при попытке опубликовать диалог.

          Подробности записаны в консоль сервера.
      edit:
        entry_deleted: "<translate:icon.deny> <red>Запись списка изменений была удалена во время редактирования."
        internal_error: |-
          <translate:icon.deny> <red>Произошла внутренняя ошибка при попытке применить изменения.

          Подробности записаны в консоль сервера.
      no_lines: "<translate:icon.deny> <red>Пожалуйста, укажите хотя бы одну строку изменений."
      add_empty_line: "<translate:icon.deny> <red>Сначала введите содержимое строки."
      no_permission: "<translate:icon.deny> <red>У вас недостаточно прав для выполнения этого действия!"
  changelog: # Интерфейс просмотра списков изменений игроками
    title: "<translate:icon.changelog> <gradient:#a366ff:#9999ff><b>Список изменений сервера"
    header: |-
      Здесь представлен обзор того, <green>что изменилось</green> на нашем сервере за последнее время!
      Новые изменения сервера выделены <red>красным цветом</red>.
    empty: "<red>Списков изменений пока нет!"
    # "entry" это формат обычной записи, а "entry_unread" —
    # формат непрочитанной записи (выделяется красным цветом)!
    # Доступные аргументы:
    #   <arg:0>: Дата и время публикации (формат настраивается в "config.yml")
    #   <arg:1>: Содержимое/строки списка изменений, уже оформленные через "entry_line"
    #   <arg:2>: Имя автора
    entry: |-
      <dark_gray><strikethrough>                            <reset> <gradient:green:red><u>Список изменений от <arg:0></u></gradient> <dark_gray><strikethrough>                            
      
      <reset><arg:1>
      
      <reset><gray>Опубликовал: <white><arg:2></white></gray>
    entry_unread: |-
      <red><b><strikethrough>                         <reset> <translate:icon.attention> <gradient:green:red><u>Список изменений от <arg:0></u></gradient> <translate:icon.attention> <red><b><strikethrough>                         
      
      <reset><arg:1>
      
      <reset><gray>Опубликовал: <white><arg:2></white></gray>
    entry_line: "<gray>- <reset><arg:0>" # Формат строки (добавляет серый дефис в начале)
    # Автор по умолчанию
    unspecified_author: "<dark_red>Не указан"
    button:
      close: "<translate:icon.confirm> <green>Выход"
    read: "<prefix><translate:icon.confirm> <green>Отмечено как прочитанные: <yellow><arg:0></yellow>!"
    manage:
      changelog_action:
        format: "<dark_gray>[<arg:0>]"
        edit: "<aqua><hover:show_text:'<aqua>✎ Редактировать список изменений'>✎"
        delete: "<red><hover:show_text:'<red>❌ Удалить список изменений'>❌"
      confirm_delete:
        title: "<translate:icon.warning> <red><b>Подтверждение удаления"
        content: |-
          Вы уверены, что хотите <b><red>удалить</red></b> <aqua>выбранный список изменений</aqua>?
          
          Обратите внимание, это действие <b><red>НЕЛЬЗЯ ОТМЕНИТЬ</red></b>!
